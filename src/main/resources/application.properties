spring.application.name=hospital
# ─────────────────────────────────────────
#  Configuration TESTS (H2 en mémoire)
#  Activé automatiquement avec @ActiveProfiles("test")
# ─────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop : recrée le schéma avant chaque test, le supprime après
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=SGH2025_CleSecrete_MinimumTrenteDeuxCaracteres!
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:3000